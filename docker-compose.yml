services:
  db:
    image: postgres:16-alpine
    container_name: cakeshop-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: kevinilhamramadhan/cake-shop-backend:latest
    container_name: cakeshop-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy

  chatbot:
    image: kevinilhamramadhan/cake-shop-chatbot:latest
    container_name: cakeshop-chatbot
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    networks:
      - internal
    depends_on:
      - backend

  frontend:
    image: kevinilhamramadhan/cake-shop-frontend:latest
    container_name: cakeshop-frontend
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: cakeshop-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - internal
    depends_on:
      - backend
      - frontend

  whatsapp:
    image: avoylenko/wwebjs-api:latest
    container_name: cakeshop-whatsapp
    restart: unless-stopped
    environment:
      API_KEY: ${WHATSAPP_API_KEY}
      BASE_WEBHOOK_URL: http://backend:3000/whatsapp/webhook
      ENABLE_LOCAL_CALLBACK_EXAMPLE: "FALSE"
    volumes:
      - whatsapp_session:/usr/src/app/sessions
    networks:
      - internal
    depends_on:
      - backend

volumes:
  db_data:
  whatsapp_session:

networks:
  internal:
    driver: bridge
