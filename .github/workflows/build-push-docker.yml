name: Build & Push Docker Image

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_IMAGE_BACKEND: ${{ secrets.DOCKERHUB_USERNAME }}/cake-Shop-backend
  DOCKER_IMAGE_CHATBOT: ${{ secrets.DOCKERHUB_USERNAME }}/cake-Shop-chatbot
  DOCKER_IMAGE_FRONTEND: ${{ secrets.DOCKERHUB_USERNAME }}/cake-Shop-frontend

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: checkout code
      uses: actions/checkout@v4

    - name: Login to Docker
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      
    - name: Build the Docker image
      uses: docker/setup-buildx-action@v3  

    - name: Build and Push Chatbot (Python)
      uses: docker/build-push-action@v6
      with:
        context: ./chatbot
        push: true
        tags: |
          ${{ env.DOCKER_IMAGE_CHATBOT }}:latest
          ${{ env.DOCKER_IMAGE_CHATBOT }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build and Push Backend (Node.js)
      uses: docker/build-push-action@v6
      with:
        context: ./backend
        push: true
        tags: |
          ${{ env.DOCKER_IMAGE_BACKEND }}:latest
          ${{ env.DOCKER_IMAGE_BACKEND }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Build and Push Frontend (React)
      uses: docker/build-push-action@v6
      with:
        context: ./frontend
        push: true
        tags: |
          ${{ env.DOCKER_IMAGE_FRONTEND }}:latest
          ${{ env.DOCKER_IMAGE_FRONTEND }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
